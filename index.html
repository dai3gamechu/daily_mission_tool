<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>デイリーミッション管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header><div><h1>デイリーミッション</h1><p id="periodLabel"></p></div><div class="clock"><span id="dateLabel"></span><small>毎朝 9:00 更新</small></div></header>

  <section class="card daily">
    <div class="section-head"><div><h2>今日のミッション</h2><p>9:00 ～ 翌日 8:59</p></div><div id="dailyCount" class="badge"></div></div>
    <div id="dailyTasks" class="tasks"></div>
    <div id="dailyDone" class="complete hidden">🎉 今日のミッション完了！</div>
  </section>

  <section class="card gold">
    <div class="section-head"><div><h2>今週のGold購入</h2><p>土曜日スタート</p></div><strong id="goldScore"></strong></div>
    <div id="weekGrid" class="week-grid"></div>
    <div class="legend"><span>✓ 購入済み</span><span>× 未達成</span><span>● 今日・未完了</span><span>－ これから</span></div>
  </section>

  <section class="card cycle">
    <div class="section-head"><div><h2>30日サイクルミッション</h2><p id="cycleDates"></p></div><div id="cycleStatus" class="badge"></div></div>
    <div class="cycle-title"><strong>アイテム購入</strong><span id="cycleCount"></span></div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="cycle-info">
      <div><span>残り期間</span><strong id="daysLeft"></strong></div>
      <div><span>必要達成</span><strong id="needed"></strong></div>
      <div class="grace"><span>許される猶予</span><strong id="grace"></strong></div>
    </div>
    <button id="cycleToggle" class="primary cycle-main-action"></button>
    <div class="cycle-adjustments">
      <div class="adjust-item"><span>目標日数</span><div class="counter compact-counter"><button id="targetMinus" type="button" aria-label="目標達成日数を1減らす">－</button><strong id="targetCount">25日</strong><button id="targetPlus" type="button" aria-label="目標達成日数を1増やす">＋</button></div></div>
      <div class="adjust-divider" aria-hidden="true"></div>
      <div class="adjust-item"><span>達成回数補正</span><div class="counter compact-counter"><button id="cycleMinus" type="button" aria-label="達成回数を1減らす">－</button><strong id="cycleManualCount">0回</strong><button id="cyclePlus" type="button" aria-label="達成回数を1増やす">＋</button></div></div>
    </div>
    <p id="cycleNote" class="note"></p>
  </section>

  <section class="card extra">
    <div class="section-head"><div><h2>今日だけの追加ミッション</h2><p>翌朝9時に自動削除</p></div></div>
    <form id="addForm"><input id="newTask" maxlength="40" placeholder="例：資源を回収" autocomplete="off"><button>＋ 追加</button></form>
    <div id="extraTasks" class="tasks compact"></div>
  </section>

  <section class="card data-management">
    <div class="section-head"><div><h2>データ管理</h2><p>達成履歴をファイルに保存・復元できます</p></div></div>
    <div class="backup-actions">
      <button id="backupBtn" class="secondary">バックアップを保存</button>
      <button id="restoreBtn" class="secondary">バックアップから復元</button>
      <input id="restoreFile" type="file" accept="application/json,.json" hidden>
    </div>
    <p class="note">ブラウザのサイトデータを削除する前などに、バックアップを保存しておくと安心です。</p>
  </section>

  <footer><button id="resetBtn" class="link-btn danger-link">保存データを初期化</button></footer>
</main>
<script src="app.js"></script>
</body></html>
